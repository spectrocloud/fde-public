# Example NodePrepProfile for an AI worker with Bluefield-3 DPUs on the
# north-south rail and ConnectX SuperNICs on two east-west rails.
# Mirrors the parameters of nodeprep-v105.sh (names in the comments).
#
# Artifacts below are the exact ones verified live on the test cluster
# (controller/agent 0.1.11): downloads are sha256-verified, and a local copy
# in the spcx cache that still hashes to the configured sha256 is reused
# instead of re-fetched — keep the checksums set so re-preps stay off the
# network.
apiVersion: nodeprep.spectrocloud.com/v1alpha1
kind: NodePrepProfile
metadata:
  name: gpu-worker-v105
spec:
  nodeSelector:
    matchLabels:
      node.spectrocloud.com/ai-worker: "true"

  firmware:
    source: http://maas.internal:8069/rcp # base URL for artifacts (MAAS mirror)
    bfb:
      name: bf-fwbundle-3.4.0-92_26.04-prod.bfb
      sha256: cfad862925ad90618cb65dce0a025d2a408a756992df9a19e203d2d2445332a5
    doca:
      deb: doca-host_3.4.0-085000-26.04-ubuntu2404_amd64.deb
      sha256: f274db1c9445bb9362565981a226966c058e068a53207890449a83c6757004aa
      # fn_init_sw_stage's exact install set: the DOCA bundle plus the
      # companion packages (mft is a hard prerequisite of the Mellanox-gated
      # steps — mlxconfig/bfb-install/mlnx_qos).
      packages: [doca-all, lldpd, mft, netplan.io, pv, psmisc]
    aptUpgrade: false

  eastWest: # LINKTYPE_EW=2, NUMVF_EW=8, MTU_EW=9216, ESWITCH_MODE=switchdev
    linkType: Ethernet
    numVFs: 8
    mtu: 9216
    eswitchMode: switchdev
    roceCC: true

  northSouth: # LINKTYPE_NS=2, NUMVF_NS=16, DPUOFFLOAD=0
    linkType: Ethernet
    numVFs: 16
    offloadEngine: none

  rails: # rails_pciaddr in the bash script
    - rail: r0
      pciFunction: "05:00"
    - rail: r1
      pciFunction: "06:00"

  hostBoot:
    iommu: intel # intel_iommu=on
    rdmaNetnsMode: "0" # options ib_core netns_mode=0
    hugepages:
      defaultSize: 1G
      pages1G: 32
    bootHook: true # nodeprep-boot.service rendered Before=kubelet.service (nil = on)
    kubeletStateReset: always # guarded stop -> rm -> start at boot
    mlnxInterfaceMgr: wait # two-condition gate (script + hardware)

  policy:
    capiPause: true # pause the CAPI Machine while prepping
    workerRoleLabel: manage # demote at Finalizing, restore at Ready
    labelCompat: v1 # mirror the legacy spectrocloud.com/nodeprep label
    maxConcurrentFlashes: 1 # fleet flash window
    disableACS: true
    taintEnabled: true # default; shown for clarity
    rebootEnabled: false # flip with the agent's -allow-reboot
    hostMutations: false # flip with the agent's -host-mutations

  nfsRdma:
    enabled: true
