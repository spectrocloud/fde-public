apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodepreps.nodeprep.spectrocloud.com
spec:
  group: nodeprep.spectrocloud.com
  names:
    kind: NodePrep
    listKind: NodePrepList
    plural: nodepreps
    singular: nodeprep
    shortNames:
      - nprep
  # Cluster-scoped: the object is named after the Node it prepairs, so
  # `kubectl get nodeprep <node>` works without a namespace lookup.
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Profile
          type: string
          jsonPath: .spec.profileRef.name
        - name: Reboots
          type: integer
          jsonPath: .status.reboots.total
        - name: Boot Verified
          type: string
          jsonPath: .status.conditions[?(@.type=="BootVerified")].status
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [nodeName, profileRef]
              properties:
                nodeName:
                  type: string
                profileRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Provisioning
                    - Flashing
                    - Configuring
                    - Finalizing
                    - Ready
                    - Failed
                observedProfileGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                reboots:
                  type: object
                  properties:
                    total:
                      type: integer
                    perStage:
                      type: object
                      additionalProperties:
                        type: integer
                bootId:
                  type: string
                steps:
                  type: array
                  items:
                    type: object
                    required: [name, stage, state]
                    properties:
                      name:
                        type: string
                      stage:
                        type: string
                      state:
                        type: string
                        enum: [Pending, InProgress, Done, Blocked, Failed]
                      inputsHash:
                        type: string
                      attempts:
                        type: integer
                      completedAt:
                        type: string
                        format: date-time
                      message:
                        type: string
                nics:
                  type: array
                  items:
                    type: object
                    properties:
                      pci:
                        type: string
                      fn:
                        type: string
                      type:
                        type: string
                      variant:
                        type: string
                      firmware:
                        type: string
                      psid:
                        type: string
                      rail:
                        type: string
                      rshim:
                        type: string
                      netdev:
                        type: string
                      ibdev:
                        type: string
                      linkWidth:
                        type: string
                      linkSpeed:
                        type: string
                      deviceID:
                        type: string
                gpus:
                  type: array
                  items:
                    type: object
                    properties:
                      pci:
                        type: string
                      name:
                        type: string
                      linkWidth:
                        type: string
                      linkSpeed:
                        type: string
