apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeprep-controller
  namespace: nodeprep-system
  labels:
    app.kubernetes.io/name: nodeprep-controller
    app.kubernetes.io/part-of: nodeprep
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nodeprep-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodeprep-controller
        app.kubernetes.io/part-of: nodeprep
    spec:
      serviceAccountName: nodeprep-controller
      # Unlike the agent DaemonSet, this Deployment gets no auto-added
      # tolerations. On a single-control-plane-node cluster it must be able to
      # run on the one node being prepped (tainted with spectrocloud.com/nodeprep
      # and carrying the control-plane taint).
      tolerations:
        - key: spectrocloud.com/nodeprep
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
      containers:
        - name: controller
          image: docker.io/kreeuwijk/ai-nodeprep:0.1.28-controller
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            # The image has no USER directive; pin an explicit non-root UID so
            # runAsNonRoot is satisfied deterministically (nobody).
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
