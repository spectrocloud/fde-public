apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeprep-controller
  namespace: nodeprep-system
  labels:
    app.kubernetes.io/name: nodeprep-controller
    app.kubernetes.io/part-of: nodeprep
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nodeprep-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodeprep-controller
        app.kubernetes.io/part-of: nodeprep
    spec:
      serviceAccountName: nodeprep-controller
      # Unlike the agent DaemonSet, this Deployment gets no auto-added
      # tolerations. On a single-control-plane-node cluster it must be able to
      # run on the one node being prepped (tainted with spectrocloud.com/nodeprep
      # and carrying the control-plane taint).
      tolerations:
        - key: spectrocloud.com/nodeprep
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
      containers:
        - name: controller
          image: ghcr.io/spectrocloud/fde-public/ai-nodeprep:1.1.0-controller
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8080
          # Both probes ask the API server for a one-item node list. A
          # controller that lost its connection stays alive but stops
          # reconciling, so liveness must fail rather than show process-only
          # health; the kubelet then restarts it and the informers re-sync.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            timeoutSeconds: 6
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 20
            timeoutSeconds: 6
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            # The image has no USER directive; pin an explicit non-root UID so
            # runAsNonRoot is satisfied deterministically (nobody).
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
