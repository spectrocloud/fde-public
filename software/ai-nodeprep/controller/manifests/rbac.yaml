apiVersion: v1
kind: Namespace
metadata:
  name: nodeprep-system
  labels:
    app.kubernetes.io/part-of: nodeprep
    # The agent DaemonSet is privileged with hostPID and hostPath mounts by
    # design (host mutations, nsenter reboots), so the namespace must opt out
    # of baseline/restricted enforcement.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodeprep-controller
  namespace: nodeprep-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodeprep-agent
  namespace: nodeprep-system
---
# Cluster controller: adoption, taint contract, labels, CAPI pause.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nodeprep-controller
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [nodeprep.spectrocloud.com]
    resources: [nodepreps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [nodeprep.spectrocloud.com]
    resources: [nodepreps/status]
    verbs: [get, update, patch]
  - apiGroups: [nodeprep.spectrocloud.com]
    resources: [nodeprepprofiles]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [cluster.x-k8s.io]
    resources: [machines]
    verbs: [get, list, watch, update, patch]
---
# Node agent: owns the NodePrep status, emits events, reads profiles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nodeprep-agent
rules:
  - apiGroups: [nodeprep.spectrocloud.com]
    resources: [nodepreps]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [nodeprep.spectrocloud.com]
    resources: [nodepreps/status]
    verbs: [get, update, patch]
  - apiGroups: [nodeprep.spectrocloud.com]
    resources: [nodeprepprofiles]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nodeprep-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nodeprep-controller
subjects:
  - kind: ServiceAccount
    name: nodeprep-controller
    namespace: nodeprep-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nodeprep-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nodeprep-agent
subjects:
  - kind: ServiceAccount
    name: nodeprep-agent
    namespace: nodeprep-system
