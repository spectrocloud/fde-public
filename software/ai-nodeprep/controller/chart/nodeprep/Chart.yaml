apiVersion: v2
name: nodeprep
description: >-
  NodePrep controller + privileged node agent: adopts Nodes via NodePrepProfile,
  walks them through Pending→Provisioning→Flashing→Configuring→Finalizing→Ready
  under the spectrocloud.com/nodeprep taint, and boot-verifies before release.
type: application
version: 0.1.0
# Bumping appVersion bumps both default image tags (see _helpers.tpl) — the
# images are built one tag per version: <appVersion>-agent / -controller.
appVersion: "0.1.80"
kubeVersion: ">=1.26.0-0"
home: https://github.com/spectrocloud/fde-public
sources:
  - https://github.com/spectrocloud/fde-public/tree/nodeprep-controller/software/ai-nodeprep/controller
keywords:
  - nodeprep
  - mellanox
  - doca
  - sriov
  - bluefield
